<!doctype html>
<!--
  ============================================================================
  CodeStreak — Apprendre Python et COBOL
  ----------------------------------------------------------------------------
  Point d'entrée de l'application. C'est une "SPA" (Single Page Application) :
  il n'y a qu'une seule page HTML, et le JavaScript (js/app.js) redessine la
  zone <main id="view"> selon l'écran affiché (accueil, parcours, leçon...).

  Aucune étape de compilation : on ouvre simplement ce fichier dans un
  navigateur, ou on le publie tel quel sur GitHub Pages.
  ============================================================================
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodeStreak — Python & COBOL</title>
  <meta name="description" content="Apprends Python et COBOL avec des leçons courtes, un streak quotidien et un tuteur IA.">

  <!-- Police arrondie, dans l'esprit de Duolingo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- Prism : coloration syntaxique des exemples de code (Python + COBOL) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== Barre du haut : logo + compteurs (streak, XP, gels) + boutons ===== -->
  <header class="topbar">
    <button class="logo" data-action="home" aria-label="Accueil">
      <span class="logo-mark">&lt;/&gt;</span> <span class="logo-text">CodeStreak</span>
    </button>

    <div class="stats" id="stats">
      <!-- Rempli dynamiquement par app.js -> renderStats() -->
    </div>

    <div class="top-actions">
      <button class="icon-btn" data-action="toggle-chat" title="Tuteur IA" aria-label="Ouvrir le tuteur IA">💬</button>
      <button class="icon-btn" data-action="settings" title="Réglages" aria-label="Réglages">⚙️</button>
    </div>
  </header>

  <!-- ===== Zone principale : chaque "écran" est injecté ici ===== -->
  <main id="view" class="view"></main>

  <!-- ===== Panneau latéral du chat IA ===== -->
  <aside id="chat" class="chat" aria-label="Tuteur IA" hidden>
    <div class="chat-head">
      <div>
        <strong>Tuteur IA</strong>
        <small id="chat-context">Pose-moi tes questions sur Python ou COBOL</small>
      </div>
      <button class="icon-btn" data-action="toggle-chat" aria-label="Fermer">✕</button>
    </div>
    <div class="chat-log" id="chat-log"></div>
    <form class="chat-form" id="chat-form">
      <textarea id="chat-input" rows="2" placeholder="Ex. : c'est quoi la différence entre une liste et un tuple ?"></textarea>
      <button class="btn btn-blue" type="submit">Envoyer</button>
    </form>
  </aside>

  <!-- ===== Fenêtre modale (réglages, messages) ===== -->
  <div id="modal" class="modal" hidden></div>

  <!-- Prism (cœur + langages). "manual" = on déclenche nous-mêmes la coloration. -->
  <script>window.Prism = { manual: true };</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cobol.min.js"></script>

  <!--
    Ordre de chargement important : les fichiers de données (leçons) et les
    modules utilitaires d'abord, puis app.js qui les utilise tous.
  -->
  <script src="js/storage.js"></script>
  <script src="js/lessons/python.js"></script>
  <script src="js/lessons/cobol.js"></script>
  <script src="js/streak.js"></script>
  <script src="js/runner.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
