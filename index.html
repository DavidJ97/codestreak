<!doctype html>
<!--
  ============================================================================
  CodeStreak — Apprendre Python et COBOL
  ----------------------------------------------------------------------------
  Point d'entrée de l'application. C'est une "SPA" (Single Page Application) :
  il n'y a qu'une seule page HTML, et le JavaScript (js/app.js) redessine la
  zone <main id="view"> selon l'écran affiché (accueil, parcours, leçon...).

  STRUCTURE DE L'ÉCRAN (ordinateur)
    ┌──────────┬────────────────────────────┬────────────┐
    │ sidebar  │  topbar                    │   rail     │
    │ (nav)    │  view (écran courant)      │ (streak,   │
    │          │                            │  objectif) │
    └──────────┴────────────────────────────┴────────────┘
  Sur mobile : la sidebar devient une barre d'onglets en bas, le rail passe
  dans l'accueil. Pendant une leçon, tout disparaît sauf la leçon (mode focus).

  Aucune étape de compilation : on ouvre ce fichier ou on le publie tel quel
  sur GitHub Pages.
  ============================================================================
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CodeStreak</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <meta name="description" content="Apprends Python, COBOL et les métiers de l'IA avec des leçons courtes, des projets GitHub, un streak quotidien et un tuteur IA.">

  <!-- Polices : Geist (interface), Geist Mono (code), Bricolage Grotesque (titres et chiffres) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Inter:opsz,wght@14..32,400..600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dial.css">
  <link rel="stylesheet" href="css/viz.css">
  <link rel="stylesheet" href="css/glass.css">
  <link rel="stylesheet" href="css/glass-theme.css">
  <link rel="stylesheet" href="css/depth.css">
</head>
<body>

  <!-- La scène éclairée cobalt et orange, derrière toute l'app (css/glass-theme.css) -->
  <div class="app-scene" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><svg viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg></div>

  <div class="shell" id="shell">

    <!-- ===== Navigation latérale (ordinateur / tablette) ===== -->
    <nav class="sidebar" aria-label="Navigation principale">
      <button class="brand" data-action="home" aria-label="CodeStreak, accueil">
        <span class="brand-mark"><i data-icon="flame" data-size="18"></i></span>
        <span class="brand-name">CodeStreak</span>
      </button>

      <div class="nav-group">
        <button class="nav-item" data-action="home" data-nav="home"><i data-icon="home"></i><span>Accueil</span></button>
        <button class="nav-item" data-action="projects" data-nav="projects"><i data-icon="briefcase"></i><span>Projets et métiers</span></button>
        <button class="nav-item" data-action="certs" data-nav="certs"><i data-icon="trophy"></i><span>Certifications</span></button>
        <button class="nav-item" data-action="journal" data-nav="journal"><i data-icon="eye"></i><span>Journal de veille</span></button>
      </div>

      <div class="nav-group">
        <span class="nav-label">Cours</span>
        <div id="nav-courses" class="nav-group"><!-- rempli par app.js -> renderNav() --></div>
      </div>

      <div class="nav-group">
        <span class="nav-label">Outils</span>
        <button class="nav-item" data-action="toggle-chat"><i data-icon="sparkles"></i><span>Tuteur IA</span></button>
        <button class="nav-item" data-action="settings"><i data-icon="settings"></i><span>Réglages</span></button>
      </div>

      <!-- Mini-carte du streak en bas de la sidebar (remplie par app.js) -->
      <div class="sidebar-foot" id="sidebar-streak"></div>
    </nav>

    <!-- ===== Colonne centrale ===== -->
    <div class="main-col">
      <header class="topbar">
        <button class="brand brand-mobile" data-action="home" aria-label="Accueil">
          <span class="brand-mark"><i data-icon="flame" data-size="16"></i></span>
        </button>
        <div class="crumb" id="crumb">Accueil</div>
        <div class="stats" id="stats"><!-- rempli par renderStats() --></div>
        <!-- Réglages : sur mobile, la barre d'onglets n'a pas la place -->
        <button class="icon-btn mobile-only" data-action="toggle-chat" aria-label="Tuteur IA"><i data-icon="sparkles"></i></button>
        <button class="icon-btn mobile-only" data-action="settings" aria-label="Réglages"><i data-icon="settings"></i></button>
      </header>

      <main id="view" class="view"></main>
    </div>

    <!-- ===== Rail de droite : streak, objectif du jour ===== -->
    <aside class="rail" id="rail" aria-label="Ta progression"></aside>
  </div>

  <!-- La navigation principale est le cadran rotatif, créé par js/dial.js -->

  <!-- ===== Panneau du tuteur IA ===== -->
  <aside id="chat" class="chat" aria-label="Tuteur IA" hidden>
    <div class="chat-head">
      <span class="chat-avatar"><i data-icon="sparkles" data-size="18"></i></span>
      <div class="chat-title">
        <strong>Tuteur IA</strong>
        <small id="chat-context">Python et COBOL</small>
      </div>
      <button class="icon-btn" data-action="toggle-chat" aria-label="Fermer le tuteur"><i data-icon="x"></i></button>
    </div>
    <div class="chat-log" id="chat-log"></div>
    <form class="chat-form" id="chat-form">
      <label for="chat-input" class="sr-only">Ton message</label>
      <textarea id="chat-input" rows="1" placeholder="Pose ta question…"></textarea>
      <button class="send-btn" type="submit" aria-label="Envoyer"><i data-icon="send" data-size="18"></i></button>
    </form>
  </aside>

  <!-- ===== Fenêtre modale (réglages) ===== -->
  <div id="modal" class="modal" hidden></div>

  <!-- Prism (coloration syntaxique). "manual" = on déclenche nous-mêmes la coloration. -->
  <script>window.Prism = { manual: true };</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cobol.min.js"></script>

  <!-- Ordre important : utilitaires et données d'abord, app.js en dernier. -->
  <script src="js/icons.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/lessons/python.js"></script>
  <script src="js/lessons/cobol.js"></script>
  <script src="js/lessons/uxai.js"></script>
  <script src="js/lessons/aieng.js"></script>
  <script src="js/lessons/linguist.js"></script>
  <script src="js/lessons/aisec.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/certs.js"></script>
  <script src="js/guides.js"></script>
  <script src="js/streak.js"></script>
  <script src="js/runner.js"></script>
  <script src="js/chat.js"></script>
  <!-- Three.js : la scène 3D (si le CDN ne répond pas, le décor CSS reste affiché) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/scene3d.js"></script>
  <script src="js/tilt.js"></script>
  <script src="js/glass.js"></script>
  <script src="js/viz.js"></script>
  <script src="js/visuals.js"></script>
  <script src="js/dial.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
